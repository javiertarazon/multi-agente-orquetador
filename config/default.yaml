database: data/orchestrator.db
workspace_root: .
default_executor: simulated
# Modelos gratuitos NVIDIA via NVIDIA NIM (fuente de verdad: config/agents.yaml).
# La key se inyecta como NVIDIA_API_KEY (ver .env / config).
kilo_model: kilo/cohere/north-mini-code:free
hermes_model: nvidia/nemotron-3-ultra-550b-a55b
hermes_provider: nvidia
# Primera opcion gratuita de Cline mediante OpenRouter; NVIDIA es fallback.
cline_model: poolside/laguna-s-2.1:free
cline_provider: openrouter
cline_fallback_model: nvidia/nemotron-3-super-120b-a12b
cline_fallback_provider: nvidia
supervision_interval_seconds: 300
max_output_bytes: 20000
security:
  require_worktree: false
  allow_auto_approval: false
  bind_host: 127.0.0.1
